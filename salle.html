<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TEMPO Salle">
<meta name="theme-color" content="#121110">
<meta name="format-detection" content="telephone=no">
<title>TEMPO · Salle</title>
<style>
  /* ============================================================
     TEMPO · style iPhone
     Sombre par choix d'usage : salle de sport, coups d'œil entre deux séries.
     Une couleur par phase : orange = effort, vert d'eau = récupération.
     Texte en rem : suit la taille de texte réglée sur l'iPhone (Dynamic Type).
     ============================================================ */
  :root{
    color-scheme: dark;
    --bg:#121110; --bg2:#1A1816;
    --surface:#211E1B; --surface2:#2C2824; --surface3:#38332E;
    --sep:rgba(246,240,231,.10);
    --ink:#F6F0E7; --mute:#B6A795; --faint:#9A8C7B;
    --effort:#FF6A2C; --effort-soft:rgba(255,106,44,.14);
    --rest:#26D3AE; --rest-soft:rgba(38,211,174,.13);
    --warn:#FF6F6F; --on-accent:#17130E;
    --accent:var(--effort); --accent-soft:var(--effort-soft);
    --r-group:14px; --r-btn:14px;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-drawer:cubic-bezier(.32,.72,0,1);
  }
  body[data-phase="recovery"], body[data-phase="end"]{ --accent:var(--rest); --accent-soft:var(--rest-soft); }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{
    font-size:106.25%; /* 17 px, le corps de texte iOS */
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    height:100%; overflow:hidden; overscroll-behavior:none;
  }
  @supports (font: -apple-system-body){ html{ font:-apple-system-body; } }
  body{
    height:100%; overflow:hidden; overscroll-behavior:none;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    font-size:1rem; line-height:1.35; -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea{ font:inherit; color:inherit; touch-action:manipulation; }
  .mono, .num-mid input, .ring-time{ font-variant-numeric:tabular-nums; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Coque ---------- */
  #app{
    position:relative; max-width:500px; margin:0 auto; height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  #screen{ position:relative; z-index:1; flex:1; min-height:0; display:flex; flex-direction:column; }
  .scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:4px 16px calc(150px + env(safe-area-inset-bottom)); }

  /* ---------- Barre de navigation ---------- */
  #topbar{ position:relative; z-index:2; flex:none; }
  .navbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:44px; padding:0 6px; }
  .nav-left{ justify-self:start; } .nav-right{ justify-self:end; }
  .nav-back{ display:flex; align-items:center; gap:2px; min-height:44px; padding:0 10px 0 4px; color:var(--accent); font-size:min(1rem, 19px); }
  .nav-back svg{ width:13px; height:22px; }
  .nav-center{ text-align:center; line-height:1.2; }
  .nav-title{ font-size:min(1rem, 19px); font-weight:600; }
  .nav-sub{ font-size:min(.765rem, 14px); color:var(--mute); font-variant-numeric:tabular-nums; }
  .icon-btn{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--accent); border-radius:22px; }
  .icon-btn svg{ width:22px; height:22px; }
  .icon-btn.off{ color:var(--faint); }
  .prog-track{ height:3px; margin:2px 16px 0; border-radius:3px; background:var(--surface2); overflow:hidden; }
  .prog-fill{ height:100%; background:var(--accent); border-radius:3px; transition:width .4s var(--ease-out); }

  /* ---------- Titres ---------- */
  .large-title{ font-size:min(2rem, 44px); font-weight:700; letter-spacing:-.02em; line-height:1.1; margin-top:6px; }
  .title1{ font-size:min(1.647rem, 38px); font-weight:700; letter-spacing:-.015em; line-height:1.15; margin-top:8px; }
  .subtitle{ font-size:.882rem; color:var(--mute); margin-top:4px; }
  .footnote{ font-size:.765rem; color:var(--faint); line-height:1.4; }

  /* ---------- Listes groupées iOS ---------- */
  .section{ margin-top:26px; }
  .section-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    font-size:.765rem; color:var(--mute); padding:0 16px 7px; }
  .section-foot{ font-size:.765rem; color:var(--faint); padding:7px 16px 0; line-height:1.4; }
  .group{ background:var(--surface); border-radius:var(--r-group); overflow:hidden; }
  .group > .row + .row, .group > .row + details, .group > details + .row{
    background-image:linear-gradient(var(--sep),var(--sep)); background-repeat:no-repeat;
    background-size:calc(100% - 16px) 1px; background-position:right top; }
  .row{ display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:10px 16px; text-align:left; }
  button.row{ transition:background-color .1s ease-out; }
  button.row:active{ background-color:var(--surface2); }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-size:1rem; }
  .row-sub{ font-size:.824rem; color:var(--mute); margin-top:1px; }
  .row-value{ flex:none; font-size:.882rem; color:var(--mute); font-variant-numeric:tabular-nums; text-align:right; }
  .row-num{ flex:none; width:1.4em; font-size:.882rem; color:var(--faint); font-variant-numeric:tabular-nums; }
  .chev{ flex:none; width:8px; height:14px; color:var(--faint); }
  .row.danger .row-title{ color:var(--warn); }
  .row.tint .row-title{ color:var(--accent); font-weight:600; }

  /* ---------- Contrôle segmenté iOS ---------- */
  .seg{ display:flex; gap:2px; padding:2px; background:var(--surface); border-radius:10px; margin-top:16px; }
  .seg button{ flex:1; min-height:36px; padding:0 6px; border-radius:8px; font-size:.824rem; font-weight:500; color:var(--mute);
    transition:background-color .15s var(--ease-out), color .15s var(--ease-out); }
  .seg button.on{ background:var(--surface3); color:var(--ink); font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,.25); }

  /* ---------- Boutons ---------- */
  .btn{ display:flex; align-items:center; justify-content:center; width:100%; min-height:54px; padding:0 16px;
    border-radius:var(--r-btn); background:var(--accent); color:var(--on-accent); font-size:min(1rem, 21px); font-weight:600; line-height:1.15; text-align:center;
    transition:transform .12s var(--ease-out), filter .12s var(--ease-out); }
  .btn:active{ transform:scale(.97); filter:brightness(.92); }
  .btn-soft{ display:flex; align-items:center; justify-content:center; min-height:54px; padding:0 18px;
    border-radius:var(--r-btn); background:var(--surface2); color:var(--ink); font-size:min(1rem, 21px); font-weight:500;
    transition:transform .12s var(--ease-out), background-color .12s var(--ease-out); }
  .btn-soft:active{ transform:scale(.97); background:var(--surface3); }
  .btn-soft.danger{ color:var(--warn); }
  .btn-ghost{ display:flex; align-items:center; justify-content:center; width:100%; min-height:44px; margin-top:6px;
    color:var(--accent); font-size:1rem; }
  .btn-ghost:active{ opacity:.6; }

  /* Barre d'action : matériau translucide, le contenu défile dessous */
  .bottom-bar{ position:absolute; left:0; right:0; bottom:0; z-index:3;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(18,17,16,.78); -webkit-backdrop-filter:blur(24px) saturate(1.6); backdrop-filter:blur(24px) saturate(1.6);
    box-shadow:0 -1px 0 var(--sep); }
  .bar-row{ display:flex; gap:10px; }
  .bar-row .btn{ flex:1; width:auto; }
  .bar-row .btn-soft{ flex:none; min-width:96px; color:var(--mute); }

  /* ---------- Accueil ---------- */
  .resume .row-title{ font-weight:600; }
  .resume-lbl{ font-size:.765rem; color:var(--effort); font-weight:600; }

  /* ---------- Effort ---------- */
  .set-line{ display:flex; align-items:center; justify-content:space-between; margin-top:18px; padding:0 2px; }
  .set-line b{ font-size:.882rem; font-weight:600; }
  .dots{ display:flex; gap:6px; }
  .dots i{ width:9px; height:9px; border-radius:50%; background:var(--surface3); }
  .dots i.done{ background:var(--accent); }
  .dots i.active{ background:var(--ink); }
  .targets{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; margin-top:10px; background:var(--surface); border-radius:var(--r-group); }
  .target{ padding:12px 14px; min-width:0; }
  .target + .target{ box-shadow:inset 1px 0 0 var(--sep); }
  .t-lbl{ font-size:.765rem; color:var(--mute); }
  .t-val{ font-size:1.235rem; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .t-val small{ font-size:.765rem; font-weight:500; color:var(--mute); margin-left:2px; }
  .t-val.accent{ color:var(--accent); }
  .t-note{ font-size:.706rem; color:var(--accent); margin-top:2px; }
  .level-row{ display:flex; align-items:center; gap:10px; padding:8px; }
  .lv-btn{ width:44px; height:44px; flex:none; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--ink);
    transition:transform .1s var(--ease-out), background-color .1s var(--ease-out); }
  .lv-btn svg{ width:18px; height:18px; }
  .lv-btn:active{ transform:scale(.94); background:var(--surface3); }
  .lv-btn:disabled{ opacity:.3; }
  .lv-name{ flex:1; text-align:center; font-size:.941rem; font-weight:600; line-height:1.3; }

  /* Fiche technique repliable */
  details.tech > summary{ list-style:none; display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 16px; font-size:1rem; }
  details.tech > summary::-webkit-details-marker{ display:none; }
  details.tech > summary:active{ background:var(--surface2); }
  details.tech > summary .chev{ margin-left:auto; transform:rotate(90deg); transition:transform .2s var(--ease-out); }
  details.tech[open] > summary .chev{ transform:rotate(-90deg); }
  .tech-body{ padding:2px 16px 16px; display:flex; flex-direction:column; gap:14px; }
  .tb h4{ font-size:.882rem; font-weight:600; color:var(--mute); margin-bottom:3px; }
  .tb.feel h4{ color:var(--accent); }
  .tb.avoid h4{ color:var(--warn); }
  .tb p{ font-size:.941rem; line-height:1.45; }
  .avoid-list{ list-style:none; display:flex; flex-direction:column; gap:6px; }
  .avoid-list li{ position:relative; padding-left:16px; font-size:.941rem; color:var(--mute); line-height:1.4; }
  .avoid-list li::before{ content:""; position:absolute; left:2px; top:.55em; width:6px; height:6px; border-radius:50%; background:var(--warn); }
  .tnote{ padding:12px 14px; border-radius:12px; background:var(--accent-soft); font-size:.882rem; line-height:1.45; }
  .tnote b{ display:block; color:var(--accent); font-size:.765rem; font-weight:600; margin-bottom:2px; }
  .reminder{ margin-top:18px; text-align:center; padding:0 12px; }

  /* ---------- Chrono (anneau) ---------- */
  .ringwrap{ position:relative; width:200px; height:200px; }
  .ring{ width:100%; height:100%; display:block; }
  .ring-bg{ fill:none; stroke:var(--surface2); stroke-width:6; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .12s linear; }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-time{ font-size:56px; font-weight:300; letter-spacing:-.02em; line-height:1; }
  .ring-sub{ font-size:.765rem; color:var(--mute); margin-top:6px; }

  /* Tenue en cours : chrono plein écran */
  body.holding #screen{ z-index:10; }
  body.holding .bottom-bar{ position:fixed; inset:0; z-index:40; background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:none;
    display:flex; flex-direction:column; padding:calc(20px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom)); }
  .hold-live{ flex:1; display:flex; flex-direction:column; width:100%; }
  .hl-main{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .hl-title{ font-size:min(1.647rem, 38px); font-weight:700; letter-spacing:-.015em; }
  .hl-lvl{ font-size:.882rem; color:var(--mute); margin-top:4px; padding:0 12px; }
  .hold-live .ringwrap{ width:280px; height:280px; margin:28px 0 0; }
  .hold-live .ring-time{ font-size:80px; font-weight:200; }
  .hold-live .btn-soft{ flex:none; width:100%; }

  /* ---------- Récupération ---------- */
  .rec-top{ display:flex; justify-content:center; padding:8px 0 4px; }
  .fields{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:14px; }
  .field > label{ display:block; font-size:.824rem; color:var(--mute); margin-bottom:6px; }
  .num{ display:flex; align-items:stretch; gap:8px; }
  .num button{ width:54px; min-height:54px; flex:none; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--ink);
    transition:transform .1s var(--ease-out), background-color .1s var(--ease-out); }
  .num button svg{ width:18px; height:18px; }
  .num button:active{ transform:scale(.94); background:var(--surface3); }
  .num-mid{ flex:1; min-width:0; display:flex; align-items:baseline; justify-content:center; gap:5px; padding:8px 6px; border-radius:12px; background:var(--bg2); }
  .num-mid input{ width:100%; max-width:4.2ch; min-width:0; background:none; border:none; outline:none; text-align:center;
    font-size:28px; font-weight:600; color:var(--ink); }
  .num-suf{ font-size:.824rem; color:var(--mute); }
  .two-fields{ display:flex; gap:10px; }
  .two-fields .field{ flex:1; min-width:0; }
  .two-fields .num{ gap:5px; }
  .two-fields .num button{ width:40px; }
  .two-fields .num-mid input{ font-size:24px; }
  .hold-done{ padding:16px; text-align:center; }
  .hd-num{ font-size:44px; font-weight:300; font-variant-numeric:tabular-nums; }
  .hd-lbl{ font-size:.824rem; color:var(--mute); margin-top:2px; }
  .lasttime{ margin-top:10px; text-align:center; font-size:.824rem; color:var(--mute); padding:0 12px; }
  .lasttime b{ color:var(--ink); font-weight:600; }
  .lasttime.up{ color:var(--rest); }
  .nudge{ margin-top:6px; text-align:center; font-size:.824rem; color:var(--rest); font-weight:500; padding:0 12px; }
  .nudge:empty{ display:none; }

  /* ---------- Fin ---------- */
  .recap .row-value{ max-width:55%; }
  .recap .row-value.empty{ color:var(--faint); }

  /* ---------- Feuilles (sheets) ---------- */
  #sheet{ position:fixed; inset:0; z-index:50; display:none; }
  #sheet.open{ display:block; }
  .sheet-scrim{ position:absolute; inset:0; background:rgba(0,0,0,.5); animation:fade .25s var(--ease-out); }
  .sheet-panel{ position:absolute; left:0; right:0; bottom:0; max-width:500px; margin:0 auto; max-height:90dvh; overflow-y:auto; overscroll-behavior:contain;
    background:var(--bg2); border-radius:14px 14px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom));
    animation:slideup .42s var(--ease-drawer); }
  .sheet-grip{ width:36px; height:5px; border-radius:3px; background:var(--surface3); margin:0 auto 14px; }
  .sheet-panel h3{ font-size:1.059rem; font-weight:600; }
  .sheet-panel .seg{ margin:14px 0; }
  .export-box{ width:100%; min-height:150px; margin-top:10px; padding:12px 14px; border:none; border-radius:12px; background:var(--surface);
    color:var(--ink); font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:16px; line-height:1.45;
    resize:vertical; white-space:pre; overflow:auto; }
  .sheet-actions{ display:flex; gap:10px; margin-top:12px; }
  .sheet-actions .btn{ flex:1; width:auto; }
  .sheet-actions .btn-soft{ flex:none; }
  .sheet-hint{ font-size:.765rem; color:var(--faint); margin-top:8px; line-height:1.4; }
  .confirm p{ font-size:.941rem; color:var(--mute); margin-top:6px; line-height:1.4; }
  .confirm .sheet-actions{ margin-top:18px; }
  .confirm .btn-soft{ flex:1; }

  /* ---------- Toast : en haut, comme une bannière iOS ---------- */
  #toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 52px); z-index:80; max-width:90%;
    transform:translate(-50%,-8px); opacity:0; pointer-events:none;
    background:var(--surface3); color:var(--ink); font-size:.882rem; font-weight:600; padding:10px 18px; border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.35); transition:opacity .2s var(--ease-out), transform .2s var(--ease-out); }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  @keyframes fade{ from{ opacity:0 } }
  @keyframes slideup{ from{ transform:translateY(100%) } }
  @keyframes screenin{ from{ opacity:0 } }
  .anim-in{ animation:screenin .16s var(--ease-out); }

  @media (max-width:360px), (max-height:700px){
    .ringwrap{ width:168px; height:168px; }
    .ring-time{ font-size:46px; }
    .hold-live .ringwrap{ width:230px; height:230px; margin-top:18px; }
    .hold-live .ring-time{ font-size:64px; }
  }
  @media (prefers-reduced-motion: reduce){
    .sheet-panel{ animation:fade .2s ease; }
    .btn:active, .btn-soft:active, .lv-btn:active, .num button:active{ transform:none; }
    .prog-fill, .ring-fg{ transition:none; }
  }
  @media (prefers-reduced-transparency: reduce){
    .bottom-bar{ background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
</style>
</head>
<body data-phase="home">
  <div id="app">
    <div id="topbar"></div>
    <main id="screen"></main>
  </div>
  <div id="sheet"></div>
  <div id="toast"></div>

<script>
"use strict";

/* ============ SÉANCE MAISON (reprise de l'app maison) ============ */
const EX_MAISON = [
  { id:1, name:"Fente, pied arrière surélevé", short:"Fente, pied arrière surélevé", muscle:"Cuisses · Fessiers",

        feel:"Avant de la cuisse et fessier de la jambe avant, un peu les deux jambes.",
        avoid:"Genou avant qui dépasse trop loin devant les orteils; buste penché en avant; pas assez profond." },
      { place:"Debout, dos à une marche basse ou un step. Pose le dessus du pied arrière dessus, pied avant un bon pas devant, à plat. Buste droit.",
        move:"Plie le genou avant pour descendre, puis pousse sur le talon avant pour remonter. Le pied arrière sert juste d'appui léger.",
        feel:"Avant de la cuisse et fessier de la jambe avant, un peu plus qu'en fente classique.",

      { place:"Même installation qu'avec la chaise, mais porte un sac à dos avec du poids dedans (livres, bouteilles d'eau), bien ajusté sur le dos.",

/* ============ PROGRAMMES ============ */
const PROGRAMS = [
  { id:"A", label:"Séance A", day:"Salle · mardi", ex:EX_A },
  { id:"B", label:"Séance B", day:"Salle · jeudi", ex:EX_B },
  { id:"M", label:"Maison",   day:"Full body",     ex:EX_MAISON },
];
let EX = [];
let TOTAL_SETS = 0;
const RING_C = 2 * Math.PI * 54;
/* ============ STOCKAGE LOCAL (robuste) ============ */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const K = { SOUND:"TEMPO_S_SOUND", PROG:"TEMPO_S_PROG", GYM:"TEMPO_S_GYM", GYM_NAMES:"TEMPO_S_GYM_NAMES" };
/* Clés séparées par séance, et distinctes de l'app maison (qui garde ses propres données). */
function kLevels(){ return "TEMPO_S_LEVELS_"+progId; }
function kHist(){ return "TEMPO_S_HIST_"+progId; }
function kActive(){ return "TEMPO_S_ACTIVE_"+progId; }

/* ============ SÉANCE ACTIVE (A ou B) ============ */
let progId = store.get("TEMPO_S_PROG", "A");
function curProg(){ return PROGRAMS.find(p=>p.id===progId) || PROGRAMS[0]; }
function applyProgram(){
  EX = curProg().ex;
  EX.forEach((e,i)=>{ e.pos=i+1; });
  TOTAL_SETS = EX.reduce((s,e)=>s+e.sets,0);
}
applyProgram();
function setProgram(id){
  if(id===progId) return;
  progId=id; store.set(K.PROG, progId);
  applyProgram();
  state.levels=loadLevels();
  state.session=null; state.exIndex=0; state.setIndex=0;
  stopCountdown(); goHome();
}

/* ============ ÉTAT ============ */
const state = {
  phase:"home", exIndex:0, setIndex:0,
  session:null,
  levels: loadLevels(),
  sound: store.get(K.SOUND, true),
  gym: store.get(K.GYM, "1"),
  cd:null, holdResult:null, holdStart:0,
};

function loadLevels(){
  const saved = store.get(kLevels(), {});
  const out = {};
  EX.forEach(e=>{ if(e.levels){ out[e.id] = (saved && saved[e.id]!=null) ? saved[e.id] : e.lvl0; } });
  return out;
}
function levelOf(ex){ return ex.levels ? (state.levels[ex.id]!=null ? state.levels[ex.id] : ex.lvl0) : null; }
function levelName(ex){ return ex.levels ? ex.levels[levelOf(ex)] : null; }

/* ============ AUDIO ============ */
let actx=null;
/* iOS : le contexte audio ne démarre ou ne repart (après verrouillage, appel, autre app)
   que pendant un geste de l'utilisateur. On le relance donc à chaque toucher, et on joue
   un son vide pour débloquer la sortie. */
function unlockAudio(){
  try{
    if(!actx || actx.state==="closed"){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
    if(!actx) return;
    if(actx.state!=="running") actx.resume();
    const src=actx.createBufferSource(); src.buffer=actx.createBuffer(1,1,22050);
    src.connect(actx.destination); src.start(0);
  }catch(e){}
}
function tone(freq,dur,at){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="triangle"; o.frequency.value=freq;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(0.9,at+0.01);
  g.gain.setValueAtTime(0.9,at+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.start(at); o.stop(at+dur+0.03);
}
function beep(freq,dur,count){
  if(!state.sound) return;
  try{
    if(!actx) unlockAudio();
    if(!actx) return;
    if(actx.state!=="running") actx.resume();
    const t=actx.currentTime+0.02, n=count||1;
    for(let i=0;i<n;i++) tone(freq, dur, t+i*(dur+0.12));
  }catch(e){}
}

/* ============ ÉCRAN ALLUMÉ ============ */
/* Pendant la séance, l'écran reste allumé : écran verrouillé, le chrono et le son s'arrêtent. */
let wakeLock=null;
function keepAwake(){
  try{
    if(wakeLock || !("wakeLock" in navigator) || document.visibilityState==="hidden") return;
    navigator.wakeLock.request("screen").then(l=>{
      wakeLock=l; l.addEventListener("release",()=>{ wakeLock=null; });
    }).catch(()=>{});
  }catch(e){}
}
function releaseAwake(){ try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock=null; }
function inSession(){ return state.phase==="effort" || state.phase==="recovery"; }
document.addEventListener("touchend", unlockAudio, { passive:true });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && inSession()) keepAwake(); });

/* ============ CHRONO GÉNÉRIQUE ============ */
function startCountdown(totalSec, opts){
  stopCountdown();
  state.cd = {
    endAt: Date.now()+totalSec*1000, total: totalSec,
    numEl: opts.numEl, ringEl: opts.ringEl,
    onDone: opts.onDone, beepOn: opts.beep!==false,
    lastSec: Math.ceil(totalSec), iv:null
  };
  tickCountdown();
  state.cd.iv = setInterval(tickCountdown, 100);
}
function tickCountdown(){
  const cd=state.cd; if(!cd) return;
  let rem=(cd.endAt-Date.now())/1000; if(rem<0) rem=0;
  const remCeil=Math.ceil(rem);
  if(cd.numEl) cd.numEl.textContent = mmss(remCeil);
  if(cd.ringEl) cd.ringEl.style.strokeDashoffset = (RING_C*(1-(cd.total? rem/cd.total : 0))).toFixed(1);
  if(remCeil<cd.lastSec){
    cd.lastSec=remCeil;
    if(cd.beepOn && remCeil>=1 && remCeil<=3) beep(880,0.12);
  }
  if(rem<=0){
    clearInterval(cd.iv);
    const done=cd.onDone, b=cd.beepOn;
    state.cd=null;
    if(b) beep(660,0.3,3);
    if(done) done();
  }
}
function stopCountdown(){ if(state.cd && state.cd.iv) clearInterval(state.cd.iv); state.cd=null; }
function addTime(sec){ if(state.cd){ state.cd.endAt+=sec*1000; state.cd.total+=sec; tickCountdown(); } }
function mmss(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

/* ============ FORMATAGE RÉSULTATS ============ */
function frNum(n){ if(n==null||isNaN(n)) return "0"; return (n%1===0)? String(n) : String(n).replace(".",","); }
function fmtResult(ex,r){
  if(!r || r.skipped) return "passée";
  if(r.assist!=null) return "assist. "+frNum(r.assist)+" kg × "+r.reps;
  if(ex.type==="machine") return frNum(r.kg)+" kg × "+r.reps;
  if(ex.type==="pushup") return r.strict+"/"+r.neg;
  if(r.assist!=null) return "assist. "+frNum(r.assist)+" kg × "+r.reps;
  if(ex.type==="reps") return ex.perSide ? (r.l+"/"+r.r) : String(r.reps);
  if(ex.type==="hold") return r.sec+" s";
  return "";
}
function frDate(iso){ const d=new Date(iso); const p=(x)=>String(x).padStart(2,"0"); return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear(); }

/* ============ HISTORIQUE / DERNIÈRE FOIS ============ */
function getHistory(){ return store.get(kHist(), []); }
/* Toutes les séances (A, B, Maison) triées par date : les id d'exercice sont uniques entre
   séances, donc un exercice déplacé d'une séance à l'autre retrouve son historique. */
function allHistory(){
  let all=[];
  PROGRAMS.forEach(p=>{ all=all.concat(store.get("TEMPO_S_HIST_"+p.id, [])); });
  return all.sort((x,y)=> String(x.date).localeCompare(String(y.date)));
}
/* Charges sur machine : on ne compare qu'avec les séances faites dans la même salle.
   Les séances enregistrées avant le choix de la salle servent de repli. */
function gymBound(ex){ return !!(ex && ex.gymDep && (ex.type==="machine" || isAssisted(ex))); }
function curGym(){ return (state.session && state.session.gym) || state.gym; }
function lastTimeResult(exId, setIdx){
  const h=allHistory();
  const bound=gymBound(EX.find(e=>e.id===exId)), g=curGym();
  let fallback=null;
  for(let i=h.length-1;i>=0;i--){
    const e=h[i].entries && h[i].entries[exId];
    if(e && e.sets && e.sets[setIdx] && !e.sets[setIdx].skipped){
      if(!bound || h[i].gym===g) return e.sets[setIdx];
      if(!h[i].gym && !fallback) fallback=e.sets[setIdx];
    }
  }
  return fallback;
}

/* ============ SALLE ============ */
function gymNames(){ const n=store.get(K.GYM_NAMES, null); return { "1":(n&&n["1"])||"Salle 1", "2":(n&&n["2"])||"Salle 2" }; }
function gymName(g){ return gymNames()[g] || ""; }
function setGym(g){
  if(g===state.gym){ renameGym(g); return; }
  state.gym=g; store.set(K.GYM, g);
  const a=getActive();
  if(a && a.session){ a.session.gym=g; store.set(kActive(), a); }
  renderHome();
}
function renameGym(g){
  let v=null;
  try{ v=window.prompt("Nom de cette salle", gymName(g)); }catch(e){}
  if(v==null) return;
  v=v.trim().slice(0,24); if(!v) return;
  const n=gymNames(); n[g]=v; store.set(K.GYM_NAMES, n);
  renderHome();
}

/* ============ SESSION ACTIVE ============ */
function newSession(){ return { date:new Date().toISOString(), startedAt:Date.now(), prog:progId, gym:(progId==="M"?null:state.gym), entries:{} }; }

/* ============ CHRONO GLOBAL DE SÉANCE ============ */
function sessionStart(s){ return (s && (s.startedAt || Date.parse(s.date))) || Date.now(); }
function fmtClock(ms){
  const t=Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor((t%3600)/60), sec=t%60;
  const p=(x)=>String(x).padStart(2,"0");
  return h ? h+":"+p(m)+":"+p(sec) : p(m)+":"+p(sec);
}
function fmtDuration(ms){
  const min=Math.round(ms/60000), h=Math.floor(min/60), m=min%60;
  return h ? h+" h "+String(m).padStart(2,"0") : m+" min";
}
function updateElapsed(){
  const el=document.getElementById("elapsed");
  if(el && state.session) el.textContent=fmtClock(Date.now()-sessionStart(state.session));
}
setInterval(updateElapsed, 1000);
function ensureEntry(){
  const ex=EX[state.exIndex];
  if(!state.session.entries[ex.id]){
    state.session.entries[ex.id] = { levelIndex: levelOf(ex), sets: Array(ex.sets).fill(null) };
  }
}
function saveActive(){ store.set(kActive(), { exIndex:state.exIndex, setIndex:state.setIndex, session:state.session }); }
function clearActive(){ store.del(kActive()); }
function getActive(){ return store.get(kActive(), null); }

/* ============ NAVIGATION ============ */
function setPhase(p){
  state.phase=p;
  document.body.classList.remove("holding");
  document.body.dataset.phase=p;
}
function nextPointer(exI,setI){
  const ex=EX[exI];
  if(setI+1 < ex.sets) return { exIndex:exI, setIndex:setI+1 };
  if(exI+1 < EX.length) return { exIndex:exI+1, setIndex:0 };
  return null;
}

function start(fresh){
  unlockAudio();
  state.session=newSession(); state.exIndex=0; state.setIndex=0;
  saveActive(); goEffort();
}
function resume(){
  unlockAudio();
  const a=getActive(); if(!a){ goHome(); return; }
  state.session=a.session || newSession();
  state.exIndex=a.exIndex||0; state.setIndex=a.setIndex||0;
  goEffort();
}
function goHome(){ stopCountdown(); releaseAwake(); setPhase("home"); renderTopbar(); renderHome(); }
function goEffort(){ stopCountdown(); keepAwake(); state.holdResult=null; setPhase("effort"); ensureEntry(); saveActive(); renderTopbar(); renderEffort(); }
function goRecovery(){ keepAwake(); setPhase("recovery"); renderTopbar(); renderRecovery(); }
function goEnd(){
  stopCountdown(); releaseAwake();
  state.session.durationMs = Date.now()-sessionStart(state.session);
  // sauvegarder la séance dans l'historique
  const h=getHistory();
  h.push(state.session);
  while(h.length>60) h.shift();
  store.set(kHist(), h);
  clearActive();
  setPhase("end"); renderTopbar(); renderEnd();
}

function setFait(){ // depuis l'écran d'effort (hors gainage)
  goRecovery();
}
/* Retour à l'accueil en pleine séance : la séance reste enregistrée et se reprend depuis l'accueil.
   Pendant le repos, la série qui vient d'être faite est enregistrée avant de partir. */
function leaveSession(){
  if(state.phase==="recovery"){
    commitInput();
    const nx=nextPointer(state.exIndex,state.setIndex);
    if(!nx){ goEnd(); return; }
    state.exIndex=nx.exIndex; state.setIndex=nx.setIndex;
  }
  saveActive();
  goHome();
}
function skipSet(){
  ensureEntry();
  state.session.entries[EX[state.exIndex].id].sets[state.setIndex] = { skipped:true };
  saveActive();
  const nx=nextPointer(state.exIndex,state.setIndex);
  if(!nx){ goEnd(); return; }
  state.exIndex=nx.exIndex; state.setIndex=nx.setIndex; goEffort();
}
function finishRest(){
  commitInput();
  stopCountdown();
  const nx=nextPointer(state.exIndex,state.setIndex);
  if(!nx){ goEnd(); return; }
  state.exIndex=nx.exIndex; state.setIndex=nx.setIndex; goEffort();
}
function commitInput(){
  const ex=EX[state.exIndex]; ensureEntry();
  let r;
  if(ex.type==="hold"){ r={ sec: (state.holdResult!=null? state.holdResult : ex.hold) }; }
  else r=readResult(ex);
  if(ex.levels) r.lvl = levelOf(ex);
  state.session.entries[ex.id].sets[state.setIndex]=r;
  saveActive();
}

/* ============ GAINAGE (tenue chronométrée) ============ */
function startHold(){
  const ex=EX[state.exIndex];
  state.holdResult=null; state.holdStart=Date.now();
  // remplace la zone d'action par le chrono live
  const bar=q("#actionbar");
  bar.innerHTML =
    '<div class="hold-live" role="timer">'+
      '<div class="hl-main">'+
        '<div class="hl-title">'+ex.name+'</div>'+
        (ex.levels ? '<div class="hl-lvl">'+levelName(ex)+'</div>' : '')+
        ringHTML("hold")+
      '</div>'+
      '<button class="btn-soft" data-act="hold-stop">J\'arrête</button>'+
    '</div>';
  document.body.classList.add("holding");
  q("#hold-sub").textContent="Tiens la position";
  startCountdown(ex.hold, {
    numEl:q("#hold-time"), ringEl:q("#hold-fg"),
    onDone:()=>{ state.holdResult=ex.hold; afterHold(); }
  });
}
function stopHold(){
  const ex=EX[state.exIndex];
  const elapsed=Math.min(ex.hold, Math.round((Date.now()-state.holdStart)/1000));
  stopCountdown();
  state.holdResult = elapsed>0 ? elapsed : 1;
  afterHold();
}
function afterHold(){
  const ex=EX[state.exIndex]; ensureEntry();
  const r = { sec: state.holdResult };
  if(ex.levels) r.lvl = levelOf(ex);
  state.session.entries[ex.id].sets[state.setIndex] = r;
  saveActive();
  goRecovery();
}

/* ============ RENDU : TOPBAR ============ */
function renderTopbar(){
  const muteBtn='<button class="icon-btn '+(state.sound?'':'off')+'" data-act="mute" aria-label="'+(state.sound?'Couper le son':'Activer le son')+'">'+(state.sound?iconSound():iconMute())+'</button>';
  if(state.phase==="home" || state.phase==="end"){
    topbar.innerHTML='<div class="navbar"><div class="nav-left"></div><div class="nav-center"></div><div class="nav-right">'+muteBtn+'</div></div>';
    return;
  }
  const ex=EX[state.exIndex];
  const done=setsBefore(state.exIndex)+state.setIndex+1;
  const pct=Math.round(done/TOTAL_SETS*100);
  const title = state.phase==="recovery" ? "Récupération" : ("Exercice "+ex.pos+" sur "+EX.length);
  topbar.innerHTML =
    '<div class="navbar">'+
      '<div class="nav-left"><button class="nav-back" data-act="leave">'+iconBack()+'Accueil</button></div>'+
      '<div class="nav-center"><div class="nav-title">'+title+'</div>'+
        '<div class="nav-sub"><span id="elapsed">'+fmtClock(Date.now()-sessionStart(state.session))+'</span> · série '+done+' sur '+TOTAL_SETS+'</div></div>'+
      '<div class="nav-right">'+muteBtn+'</div>'+
    '</div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>';
}

function field(label,suf,inner){ return '<div class="field"><label>'+label+'</label>'+inner+'</div>'; }
function numHTML(id, val, step, suf){

    '<button data-act="step" data-tgt="'+id+'" data-step="'+step+'" data-dir="1" aria-label="Plus">'+iconPlus()+'</button>'+
  '</div>';

function isAssisted(ex){ return !!(ex.assistLevels && ex.assistLevels.indexOf(levelOf(ex))>=0); }
/* Double progression : la charge (ou l'assistance) ne change que si, la dernière fois,
   TOUTES les séries prévues ont atteint le haut de fourchette. Toutes les séries reçoivent
   la même charge : la plus lourde (ou l'assistance la plus faible) tenue dans la fourchette. */
function lastSessionSets(ex){
  const h=allHistory(), bound=gymBound(ex), g=curGym(), lvl=levelOf(ex);
  let fallback=null;
  for(let i=h.length-1;i>=0;i--){
    const e=h[i].entries && h[i].entries[ex.id];
    if(!e || !e.sets) continue;
    const done=e.sets.filter(r=> r && !r.skipped && !(ex.levels && r.lvl!=null && r.lvl!==lvl));
    if(!done.length) continue;
    if(!bound || h[i].gym===g) return done;
    if(!h[i].gym && !fallback) fallback=done;
  }
  return fallback;
}
function suggestLoad(ex){
  const done=lastSessionSets(ex);
  const allTop = !!done && done.length>=ex.sets && done.every(r=>r.reps>=ex.hi);
  if(ex.type==="machine"){
    const sets=done ? done.filter(r=>r.kg!=null) : [];
    if(!sets.length) return { kg:ex.startKg, bumped:false };
    const ok=sets.filter(r=>r.reps>=ex.lo);
    const base=Math.max.apply(null,(ok.length?ok:sets).map(r=>r.kg));
    if(ex.kgStep && allTop) return { kg:base+ex.kgStep, bumped:true };
    return { kg:base, bumped:false };
  }
  if(isAssisted(ex)){
    const sets=done ? done.filter(r=>r.assist!=null) : [];
    if(!sets.length) return { assist:ex.startAssist, bumped:false };
    const ok=sets.filter(r=>r.reps>=ex.lo);
    const base=Math.min.apply(null,(ok.length?ok:sets).map(r=>r.assist));
    if(allTop) return { assist:Math.max(0,base-ex.assistStep), bumped:true };
    return { assist:base, bumped:false };
  }
  return null;
}
function prefill(ex){
  const L=(idx)=>lastTimeResult(ex.id, idx);
  const last=L(state.setIndex);
  if(ex.type==="machine") return { kg:suggestLoad(ex).kg, reps:last?last.reps:ex.lo };
  if(isAssisted(ex)) return { assist:suggestLoad(ex).assist, reps:last?last.reps:ex.lo };
  if(ex.type==="pushup")  return last ? {strict:last.strict, neg:last.neg} : {strict:5, neg:3};
  if(ex.type==="reps"){
    if(ex.perSide) return last ? {l:last.l, r:last.r} : {l:ex.lo, r:ex.lo};
    return last ? {reps:last.reps} : {reps:ex.lo};
  }
  return {};
}
function readResult(ex){
  const iv=(id)=>{ const el=q("#"+id); const n=parseInt((el?el.value:"0").replace(/[^0-9]/g,""),10); return isNaN(n)?0:n; };
  const fv=(id)=>{ const el=q("#"+id); const n=parseFloat((el?el.value:"0").replace(",",".").replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; };
  if(ex.type==="machine") return { kg:fv("in-kg"), reps:iv("in-reps") };
  if(isAssisted(ex)) return { assist:fv("in-assist"), reps:iv("in-reps") };
  if(ex.type==="pushup")  return { strict:iv("in-strict"), neg:iv("in-neg") };
  if(ex.type==="reps")    return ex.perSide ? { l:iv("in-l"), r:iv("in-r") } : { reps:iv("in-reps") };
  return {};
}
function updateNudge(){
  const ex=EX[state.exIndex]; const el=q("#nudge"); if(!el) return;
  let txt="";
  if(isAssisted(ex)){
    const r=readResult(ex);
    if(r.reps>=ex.hi) txt="Haut de fourchette atteint : l'assistance baissera la prochaine fois si toutes tes séries y arrivent.";
  } else if(ex.type==="machine"){
    const r=readResult(ex);
    if(r.reps>=ex.hi) txt="Haut de fourchette atteint : la charge montera la prochaine fois si toutes tes séries y arrivent.";
  } else if(ex.type==="reps"){
    const r=readResult(ex);
    const v=ex.perSide ? Math.min(r.l,r.r) : r.reps;
    if(v>=ex.hi && ex.levels) txt="Haut de fourchette atteint : monte d'un niveau la prochaine fois si toutes tes séries y arrivent.";
  } else if(ex.type==="pushup"){
    const r=readResult(ex);
    if(ex.hi && r.strict>=ex.hi) txt="Haut de fourchette atteint : monte d'un niveau la prochaine fois si toutes tes séries y arrivent.";
  } else if(ex.type==="hold"){
    if(state.holdResult>=ex.hold) txt = ex.levels ? "Tenu jusqu'au bout : passe au niveau suivant la prochaine fois si toutes tes séries y arrivent." : "Tenu jusqu'au bout.";
  }
  el.textContent=txt;
}

/* ============ EXPORT ============ */
function sessionText(s){
  const lines=["Séance "+(s.prog||progId)+" du "+frDate(s.date)+(s.gym ? " · "+gymName(s.gym) : "")+(s.durationMs ? " (durée "+fmtDuration(s.durationMs)+")" : "")];
  EX.forEach(ex=>{
    const e=s.entries[ex.id]; if(!e) return;
    const items=[];
    e.sets.forEach(r=>{
      if(!r || r.skipped) return;
      items.push({ text: fmtResult(ex,r), lvl: ex.levels ? r.lvl : null });
    });
    if(!items.length) return;
    let label=ex.pos+". "+ex.short;
    let resultStr;
    if(ex.levels){
      // regroupe les séries consécutives faites au même niveau
      const groups=[];
      items.forEach(it=>{
        const last=groups[groups.length-1];
        if(last && last.lvl===it.lvl) last.texts.push(it.text);
        else groups.push({ lvl: it.lvl, texts:[it.text] });
      });
      if(groups.length===1){
        const ln=(ex.levels[groups[0].lvl]||"").toLowerCase();
        label+=" (niveau : "+ln+")";
        resultStr=groups[0].texts.join(", ");
      } else {
        resultStr=groups.map(g=>{
          const ln=(ex.levels[g.lvl]||"").toLowerCase();
          return g.texts.join(", ")+" ("+ln+")";
        }).join(", ");
      }
    } else {
      resultStr=items.map(it=>it.text).join(", ");
    }
    let line=label+" : "+resultStr;
    if(ex.perSide) line+=" (par "+ex.sideWord+")";
    lines.push(line);
  });
  return lines.join("\n");
}
function buildExport(scope){
  const h=getHistory();
  if(!h.length) return "";
  if(scope==="last") return sessionText(h[h.length-1]);
  return h.map(sessionText).join("\n\n");
}

      '<div class="sheet-panel confirm"><div class="sheet-grip"></div>'+
        '<h3>Aucune séance enregistrée</h3>'+
        '<p>Termine une séance pour pouvoir l\'exporter.</p>'+
        '<div class="sheet-actions"><button class="btn-soft" data-act="sheet-close">Fermer</button></div>'+
      '</div>';
    sheetEl.classList.add("open"); return;
  }
  const render=()=>{
    sheetEl.innerHTML =
      '<div class="sheet-scrim" data-act="sheet-close"></div>'+
      '<div class="sheet-panel"><div class="sheet-grip"></div>'+
        '<h3>Exporter mes séances</h3>'+
        '<div class="seg">'+
          '<button class="'+(scope==="last"?"on":"")+'" data-act="exp-scope" data-scope="last">Dernière séance</button>'+
          '<button class="'+(scope==="all"?"on":"")+'" data-act="exp-scope" data-scope="all">Tout l\'historique</button>'+
        '</div>'+
        '<textarea class="export-box" id="export-box" readonly>'+escapeHtml(buildExport(scope))+'</textarea>'+
        '<div class="sheet-actions">'+
          '<button class="btn" data-act="exp-copy">Copier</button>'+
          '<button class="btn-soft" data-act="sheet-close">Fermer</button>'+
        '</div>'+
        '<div class="sheet-hint">Si la copie ne marche pas, sélectionne le texte ci-dessus et copie-le à la main.</div>'+
      '</div>';
    sheetEl.classList.add("open");
  };
  sheetEl._setScope=(sc)=>{ scope=sc; render(); };
  render();
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function doCopy(){
  const box=document.getElementById("export-box");
  if(!box) return;
  const text=box.value;
  const ok=()=>toast("Copié ✓");
  const fail=()=>{ box.focus(); box.select(); try{ box.setSelectionRange(0,text.length);}catch(e){} toast("Sélectionne et copie le texte"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(fail);
  } else {
    box.focus(); box.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ fail(); }
  }
}
function closeSheet(){ sheetEl.classList.remove("open"); sheetEl.innerHTML=""; }

/* ============ SAUVEGARDE / RESTAURATION ============ */
function backupKeys(){
  const out={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.indexOf("TEMPO_S_")===0) out[k]=localStorage.getItem(k);
    }
  }catch(e){}
  return out;
}
function backupCode(){ return JSON.stringify({ app:"TEMPO_SALLE", v:1, date:new Date().toISOString(), data:backupKeys() }); }
function openBackup(){
  sheetEl.innerHTML =
    '<div class="sheet-scrim" data-act="sheet-close"></div>'+
    '<div class="sheet-panel"><div class="sheet-grip"></div>'+
      '<h3>Sauvegarder mes données</h3>'+
      '<p class="sheet-hint" style="margin:0 0 10px">Historique, niveaux et séance en cours des trois séances. Copie ce code et garde-le dans tes notes.</p>'+
      '<textarea class="export-box" id="export-box" readonly>'+escapeHtml(backupCode())+'</textarea>'+
      '<div class="sheet-actions"><button class="btn" data-act="exp-copy">Copier la sauvegarde</button></div>'+
      '<h3 style="margin-top:22px">Restaurer</h3>'+
      '<p class="sheet-hint" style="margin:0 0 10px">Colle ici un code de sauvegarde. Ses séances s\'ajoutent à celles déjà présentes, rien n\'est effacé.</p>'+
      '<textarea class="export-box" id="restore-box" placeholder="Colle ton code ici"></textarea>'+
      '<div class="sheet-actions">'+
        '<button class="btn" data-act="restore">Restaurer</button>'+
        '<button class="btn-soft" data-act="sheet-close">Fermer</button>'+
      '</div>'+
    '</div>';
  sheetEl.classList.add("open");
}
function doRestore(){
  const box=document.getElementById("restore-box");
  let obj=null;
  try{ obj=JSON.parse((box&&box.value||"").trim()); }catch(e){}
  if(!obj || obj.app!=="TEMPO_SALLE" || !obj.data || typeof obj.data!=="object"){
    toast("Code de sauvegarde illisible"); return;
  }
  /* Fusion : les séances du code s'ajoutent à celles déjà présentes (doublons ignorés),
     et les réglages actuels (niveaux, séance en cours) sont conservés s'ils existent. */
  let added=0;
  try{
    Object.keys(obj.data).forEach(k=>{
      if(k.indexOf("TEMPO_S_")!==0) return;
      const cur=localStorage.getItem(k);
      if(k.indexOf("TEMPO_S_HIST_")===0){
        let a=[], b=[];
        try{ a=JSON.parse(cur||"[]"); }catch(e){}
        try{ b=JSON.parse(obj.data[k]||"[]"); }catch(e){}
        const seen=new Set(a.map(x=>x.date));
        b.forEach(x=>{ if(x && x.date && !seen.has(x.date)){ a.push(x); seen.add(x.date); added++; } });
        a.sort((x,y)=> String(x.date).localeCompare(String(y.date)));
        while(a.length>60) a.shift();
        localStorage.setItem(k, JSON.stringify(a));
      } else if(cur==null){
        localStorage.setItem(k, obj.data[k]);
      }
    });
  }catch(e){ toast("Restauration impossible"); return; }
  progId = store.get(K.PROG, "A");
  applyProgram(); state.levels=loadLevels(); state.session=null;
  closeSheet(); goHome(); toast(added+" séance"+(added>1?"s":"")+" ajoutée"+(added>1?"s":"")+" ✓");
}

/* ============ CONFIRMATIONS ============ */
function askRestart(){
  sheetEl.innerHTML =
    '<div class="sheet-scrim" data-act="sheet-close"></div>'+
    '<div class="sheet-panel confirm"><div class="sheet-grip"></div>'+
      '<h3>Recommencer la séance ?</h3>'+
      '<p>La séance en cours sera abandonnée et tu repartiras du premier exercice.</p>'+
      '<div class="sheet-actions">'+
        '<button class="btn-soft" data-act="sheet-close">Annuler</button>'+
        '<button class="btn-soft danger" data-act="do-restart">Recommencer</button>'+
      '</div>'+
    '</div>';
  sheetEl.classList.add("open");
}
function askErase(){
  sheetEl.innerHTML =
    '<div class="sheet-scrim" data-act="sheet-close"></div>'+
    '<div class="sheet-panel confirm"><div class="sheet-grip"></div>'+
      '<h3>Effacer les données de cette séance ?</h3>'+
      '<p>Historique et niveaux de la séance affichée seulement. La seconde séance reste intacte. Action irréversible.</p>'+
      '<div class="sheet-actions">'+
        '<button class="btn-soft" data-act="sheet-close">Annuler</button>'+
        '<button class="btn-soft danger" data-act="do-erase">Tout effacer</button>'+
      '</div>'+
    '</div>';
  sheetEl.classList.add("open");
}
function eraseAll(){
  store.del(kHist()); store.del(kLevels()); store.del(kActive());
  /* n'efface que la séance affichée : l'autre séance et l'app maison sont intactes */
  state.levels=loadLevels();
  closeSheet(); goHome(); toast("Données effacées");
}

/* ============ NIVEAU ============ */
function changeLevel(dir){
  const ex=EX[state.exIndex]; if(!ex.levels) return;
  let i=levelOf(ex)+dir; i=Math.max(0,Math.min(ex.levels.length-1,i));
  state.levels[ex.id]=i; store.set(kLevels(), state.levels);
  ensureEntry(); state.session.entries[ex.id].levelIndex=i; saveActive();
  renderEffort();
}

/* ============ STEPPER NUMÉRIQUE ============ */
function step(tgt,stepVal,dir){
  const el=q("#"+tgt); if(!el) return;
  let cur=parseFloat((el.value||"0").replace(",","."));
  if(isNaN(cur)) cur=0;
  let v=cur + dir*stepVal;
  if(v<0) v=0;
  v=Math.round(v*100)/100;
  const isDecimal = (stepVal % 1 !== 0);
  el.value = isDecimal ? frNum(v) : String(Math.round(v));
  updateNudge();
}

/* ============ SON ============ */
function toggleMute(){
  state.sound=!state.sound; store.set(K.SOUND, state.sound);
  unlockAudio();
  if(state.sound) beep(880,0.15);
  renderTopbar();
  toast(state.sound ? "Son activé" : "Son coupé");
}

/* ============ TOAST ============ */
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1700);
}

/* ============ DELEGATION DES CLICS ============ */
document.addEventListener("click",(ev)=>{
  unlockAudio();
  const btn=ev.target.closest("[data-act]"); if(!btn) return;
  const act=btn.getAttribute("data-act");
  switch(act){
    case "start": start(true); break;
    case "resume": resume(); break;
    case "ask-restart": askRestart(); break;
    case "do-restart": closeSheet(); start(true); break;
    case "fait": setFait(); break;
    case "skip": skipSet(); break;
    case "hold-start": startHold(); break;
    case "hold-stop": stopHold(); break;
    case "finish-rest": finishRest(); break;
    case "add15": addTime(15); toast("+15 s"); break;
    case "lvl": changeLevel(parseInt(btn.getAttribute("data-dir"),10)); break;
    case "step": step(btn.getAttribute("data-tgt"), parseFloat(btn.getAttribute("data-step")), parseInt(btn.getAttribute("data-dir"),10)); break;
    case "mute": toggleMute(); break;
    case "export-home": case "export-end": openExport("last"); break;
    case "exp-scope": if(sheetEl._setScope) sheetEl._setScope(btn.getAttribute("data-scope")); break;
    case "exp-copy": doCopy(); break;
    case "backup": openBackup(); break;
    case "restore": doRestore(); break;
    case "sheet-close": closeSheet(); break;
    case "ask-erase": askErase(); break;
    case "do-erase": eraseAll(); break;
    case "prog": setProgram(btn.getAttribute("data-prog")); break;
    case "gym": setGym(btn.getAttribute("data-gym")); break;
    case "go-home": goHome(); break;
    case "leave": leaveSession(); break;
  }
});

/* ============ DÉMARRAGE ============ */
renderTopbar();
goHome();
</script>
